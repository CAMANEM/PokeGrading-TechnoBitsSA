name: pokegrading_frontend
description: PokéGrading — Frontend Flutter Web
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Navigation ───────────────────────────────────────────
  go_router: ^13.2.0

  # ─── HTTP / API Client ────────────────────────────────────
  http: ^1.2.1

  # ─── UI ───────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ─── Utilidades ──────────────────────────────────────────
  uuid: ^4.4.0
  pokegrading_logging:
    path: ../packages/pokegrading_logging
  pokegrading_exceptions:
    path: ../packages/pokegrading_exceptions
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─── Linting ─────────────────────────────────────────────
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
