name: pokegrading_frontend
description: PokéGrading — Frontend Flutter Web
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Gestión de Estado ────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ─── Navegación ───────────────────────────────────────────
  go_router: ^13.2.0

  # ─── HTTP / API Client ────────────────────────────────────
  http: ^1.2.1

  # ─── UI ───────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ─── Utilidades ──────────────────────────────────────────
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─── Linting ─────────────────────────────────────────────
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
