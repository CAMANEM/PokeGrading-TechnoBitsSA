name: pokegrading_frontend
description: PokéGrading — Frontend Flutter Web
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Gestión de Estado ────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ─── Navegación ───────────────────────────────────────────
  go_router: ^13.2.0

  # ─── HTTP / API Client ────────────────────────────────────
  http: ^1.2.1

  # ─── UI ───────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ─── Utilidades ──────────────────────────────────────────
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─── Code Generation ─────────────────────────────────────
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.9

  # ─── Linting ─────────────────────────────────────────────
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
