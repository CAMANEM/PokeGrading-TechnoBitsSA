version: '3.9'

# ============================================================
# PokéGrading — Docker Compose (Desarrollo Local)
# ============================================================
# Levanta: PostgreSQL 16 + pgAdmin 4
# Uso: docker compose up -d
# ============================================================

services:
  # ─── Base de Datos PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pokegrading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pokegrading}
      POSTGRES_USER: ${DB_USER:-pokegrading_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pokegrading_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pokegrading_user} -d ${DB_NAME:-pokegrading}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pokegrading_network

  # ─── pgAdmin (UI para PostgreSQL) ─────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pokegrading_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pokegrading.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pokegrading_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  pokegrading_network:
    driver: bridge
