version: '3.9'

# ============================================================
# PokeGrading — Docker Compose (Local Development)
# ============================================================
# Services: PostgreSQL 16 + MongoDB 7 + pgAdmin 4
# Usage: docker compose up -d
# ============================================================

services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pokegrading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pokegrading}
      POSTGRES_USER: ${DB_USER:-pokegrading_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pokegrading_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pokegrading_user} -d ${DB_NAME:-pokegrading}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pokegrading_network

  # ─── MongoDB (image binaries via GridFS) ────────────────
  mongodb:
    image: mongo:7
    container_name: pokegrading_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-pokegrading_images}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/db/mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pokegrading_network

  # ─── pgAdmin (PostgreSQL UI) ──────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pokegrading_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pokegrading.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pokegrading_network

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  pokegrading_network:
    driver: bridge
